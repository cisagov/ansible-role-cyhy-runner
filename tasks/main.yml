---
- name: Install the cyhy-runner package
  ansible.builtin.pip:
    executable: /usr/bin/pip3
    # The extra argument is necessary on modern platforms, which
    # correctly recognize that the local Python is externally managed
    # (i.e. managed via the system package manager and not by pip).
    extra_args: >-
      {{ (ansible_distribution in ['Kali'] or
      (ansible_distribution in ['Debian', 'Ubuntu']
      and ansible_distribution_release not in ['buster', 'bullseye'])) |
      ternary('--break-system-packages', omit) }}
    name: >-
      https://api.github.com/repos/cisagov/cyhy-runner/tarball/{{ cyhy_runner_version }}

- name: Create some directories that cyhy-runner requires
  ansible.builtin.file:
    group: "{{ cyhy_runner_file_owner_group | default(omit) }}"
    mode: u=rwx,g=rx,o=rx
    owner: "{{ cyhy_runner_file_owner_username | default(omit) }}"
    path: "{{ item }}"
    state: directory
  loop:
    - /var/cyhy/runner
    - /var/cyhy/runner/done
    - /var/cyhy/runner/running
    - /var/log/cyhy

# Copy the systemd unit file
- name: Copy the systemd unit file for cyhy-runner
  ansible.builtin.copy:
    dest: /lib/systemd/system/cyhy-runner.service
    mode: u=rw,g=r,o=r
    src: cyhy-runner.service

# Enable cyhy-runner
- name: Enable cyhy-runner
  ansible.builtin.service:
    enabled: true
    name: cyhy-runner
